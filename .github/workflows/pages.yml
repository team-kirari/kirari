name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [photos-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-photo-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: photo-pipeline/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: photo-pipeline
      - run: npm test
        working-directory: photo-pipeline
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check private photo token configuration
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_ASSETS_READ_TOKEN: ${{ secrets.PRIVATE_ASSETS_READ_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PRIVATE_ASSETS_READ_TOKEN" ]]; then
            echo "::error::Set the PRIVATE_ASSETS_READ_TOKEN Actions repository secret in team-kirari/kirari. Use a fine-grained PAT with Contents read access to team-kirari/kirari-private."
            exit 1
          fi
      - name: Check out approved public photo sources
        if: github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: team-kirari/kirari-private
          ref: main
          token: ${{ secrets.PRIVATE_ASSETS_READ_TOKEN }}
          path: .local/kirari-private
          persist-credentials: false
      - name: Prepare synthetic photos for secret-free PR checks
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types scripts/prepare-photo-fixtures.mjs
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Check upload Worker bundle
        run: npx wrangler deploy --dry-run --config worker/wrangler.jsonc --outdir .local/worker-bundle
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_LOG_PATH: .local/wrangler.log
      - name: Check story Worker bundle
        run: npx wrangler deploy --dry-run --config worker/stories.wrangler.jsonc --outdir .local/story-worker-bundle
        env:
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_LOG_PATH: .local/wrangler-story.log
      - name: Build public site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_PHOTO_UPLOAD_URL: ${{ vars.VITE_PHOTO_UPLOAD_URL }}
          VITE_STORY_API_URL: ${{ vars.VITE_STORY_API_URL }}
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, check-photo-pipeline]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
